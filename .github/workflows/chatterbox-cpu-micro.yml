name: Chatterbox CPU Micro Audition
on:
  pull_request:
    branches: [main]
    paths:
      - "tts/micro_cpu.py"
      - "tts/micro_cpu_trigger.txt"
permissions:
  contents: read
jobs:
  micro:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install Chatterbox
        run: |
          pip install --upgrade pip
          pip install chatterbox-tts pydub requests
      - name: Render micro audition
        run: python tts/micro_cpu.py
      - name: Upload micro audition
        uses: actions/upload-artifact@v4
        with:
          name: chatterbox-cpu-micro-audition
          path: tts/output/CPU_MICRO_AUDITION.mp3
          retention-days: 1
          compression-level: 0
