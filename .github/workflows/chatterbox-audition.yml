name: Chatterbox Voice Audition
on:
  pull_request:
    branches:
      - main
    paths:
      - "tts/audition.py"
      - "tts/audition-trigger.txt"

permissions:
  contents: read

jobs:
  audition:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install neural TTS
        run: |
          python -m pip install --upgrade pip
          pip install chatterbox-tts pydub requests
      - name: Render audition
        run: python tts/audition.py
      - name: Upload audition
        uses: actions/upload-artifact@v4
        with:
          name: socrates-husserl-chatterbox-audition
          path: tts/output/AUDITION_ONLY.mp3
          retention-days: 1
          compression-level: 0
